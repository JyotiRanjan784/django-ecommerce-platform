<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Payment Successful</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
            background: #f5f5f5;
        }
        .success-box {
            background: white;
            width: 500px;
            max-width: 90%;
            margin: auto;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: green;
        }
        .order-id {
            font-weight: bold;
        }
        .amount {
            font-size: 22px;
        }
        a {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #3399cc;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="success-box">
        <h1>Payment Successful! ✅</h1>
        <p>
            Your payment has been successfully verified.
        </p>
        <p>
            Order ID:
            <span class="order-id">
                {{ order.order_id }}
            </span>
        </p>

        <p class="amount">
            Amount Paid:
            ₹{{ order.amount|floatformat:0 }}
        </p>

        <p>
            Payment ID:
            {{ order.razorpay_payment_id }}
        </p>

        <a href="{% url 'index' %}">
            Continue Shopping
        </a>

        <script>
            // Clear cart only after successful payment
            localStorage.removeItem("cart");

            // Refresh cart count if your navbar uses it
            if (typeof updateCart === "function") {
                updateCart();
            }
        </script>
    </div>
</body>
</html>
